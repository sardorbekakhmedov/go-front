
<h1>Mavzular</h1>

<ol class="quiz-nav">
  @for (q of quizService.quizzes(); track q.id) {
    <li class="quiz-item" [routerLink]="['/question', q.id]" 
    routerLinkActive="selected-quiz">
        <div>

            <span class="title">{{ q.title }}</span>
            
            <div>
                <span >{{ q.duration }} min</span>
            </div>
        </div>
    </li>
  }
</ol>
